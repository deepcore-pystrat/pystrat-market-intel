[project]
name = "market_intel_pystrat"
version = "0.1.0"
description = "Market Intel (DeepCore) profile replication built on top of pystrat"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "pystrat @ git+https://github.com/deepcore-pystrat/pystrat-lib.git",
    "plotly>=5",
]

[project.optional-dependencies]
dev = ["pytest"]
postgres = ["psycopg2-binary>=2.9", "python-dotenv"]
ingest = ["psycopg2-binary>=2.9", "python-dotenv", "ib_insync"]
publish = ["python-dotenv", "slack_sdk", "boto3"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["market_intel_pystrat*"]